name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Lint watcher
        run: cd apps/watcher && uv run ruff check app tests
      - name: Lint indexer
        run: cd apps/indexer && uv run ruff check app tests

  test-python:
    name: Unit Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Test watcher
        run: cd apps/watcher && uv run pytest tests/unit -v
      - name: Test indexer
        run: cd apps/indexer && uv run pytest tests/unit -v

  lint-ts:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd apps/api && npm ci && npm run lint

  test-ts:
    name: Unit Tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd apps/api && npm ci && npm run test:unit
