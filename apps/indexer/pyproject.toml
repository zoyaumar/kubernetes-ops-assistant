[project]
name = "indexer"
version = "0.1.0"
description = "NATS consumer + Kubernetes event processor — normalizes, chunks, embeds, and persists cluster events into PostgreSQL + pgvector."
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.7.0",                        # NATS JetStream consumer
    "asyncpg>=0.29.0",                        # Async PostgreSQL driver
    "sqlalchemy[asyncio]>=2.0.30",            # ORM + query builder
    "alembic>=1.13.0",                        # DB migrations
    "sentence-transformers>=3.0.0",           # Local CPU embedding model
    "torch>=2.3.0",                           # Required by sentence-transformers (CPU only)
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "aiohttp>=3.9.5",                         # Health endpoint
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"
