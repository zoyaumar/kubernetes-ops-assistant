# Grafana — dashboard visualization.
#
# Dashboards to provision (see docs/architecture.md):
#   1. System health
#   2. NATS/indexer throughput
#   3. RAG latency
#   4. KEDA scaling
#   5. Errors/DLQ
#
# TODO(week-7): provision dashboards via ConfigMap (Grafana provisioning API)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: k8s-ops
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: k8s-ops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin   # TODO: use a Secret
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: k8s-ops
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
