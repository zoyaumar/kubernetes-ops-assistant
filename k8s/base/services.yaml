apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: k8s-ops
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: k8s-ops
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
