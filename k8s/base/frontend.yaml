# Frontend (React/Vite/nginx) Deployment
#
# TODO(week-6): add nginx ConfigMap with try_files for React Router
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: k8s-ops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: k8s-ops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/YOUR_GITHUB_USER/frontend:latest  # TODO: replace with git-sha tag
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
