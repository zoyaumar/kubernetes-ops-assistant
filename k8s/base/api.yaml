apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: k8s-ops
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: k8s-ops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: api:dev
          env:
            - name: API_PORT
              value: "3000"
            - name: POSTGRES_DSN
              value: postgresql://k8s_ops:changeme@postgres.k8s-ops.svc.cluster.local:5432/k8s_ops
            - name: EMBEDDING_DIM
              value: "384"
          ports:
            - containerPort: 3000
