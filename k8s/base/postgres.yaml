apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: k8s-ops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: k8s-ops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: k8s-ops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_DB
              value: k8s_ops
            - name: POSTGRES_USER
              value: k8s_ops
            - name: POSTGRES_PASSWORD
              value: changeme
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: k8s-ops
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
