# Indexer Deployment
#
# KEDA scales this deployment based on NATS pending message count.
# See k8s/keda/indexer-scaledobject.yaml.
#
# Resource limits are intentionally conservative for local kind clusters.
# Adjust based on actual measurements.
#
# TODO(week-3): add Secret references for POSTGRES_DSN
# TODO(week-4): add volume for embedding model cache
# TODO(week-7): add liveness/readiness probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: k8s-ops
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/component: indexer
    app.kubernetes.io/part-of: k8s-ops-assistant
spec:
  replicas: 1  # KEDA will manage this; do not set to 0 manually
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: indexer
          image: ghcr.io/YOUR_GITHUB_USER/indexer:latest  # TODO: replace with git-sha tag
          env:
            - name: CLUSTER_ID
              value: local-kind
            - name: NATS_URL
              value: nats://nats.k8s-ops.svc.cluster.local:4222
            - name: POSTGRES_DSN
              value: postgresql+asyncpg://k8s_ops:changeme@postgres.k8s-ops.svc.cluster.local:5432/k8s_ops
            - name: EMBEDDING_MODEL
              value: sentence-transformers/all-MiniLM-L6-v2
            - name: EMBEDDING_DIM
              value: "384"
            - name: LOG_LEVEL
              value: info
          ports:
            - containerPort: 8081  # health + metrics
          resources:
            requests:
              cpu: 200m
              memory: 512Mi   # sentence-transformers model needs ~300MB
            limits:
              cpu: 1000m
              memory: 1Gi
