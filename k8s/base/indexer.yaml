apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: k8s-ops
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/component: indexer
    app.kubernetes.io/part-of: k8s-ops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      containers:
        - name: indexer
          image: indexer:dev
          env:
            - name: CLUSTER_ID
              value: local-kind
            - name: NATS_URL
              value: nats://nats.k8s-ops.svc.cluster.local:4222
            - name: POSTGRES_DSN
              value: postgresql+asyncpg://k8s_ops:changeme@postgres.k8s-ops.svc.cluster.local:5432/k8s_ops
            - name: EMBEDDING_MODEL
              value: sentence-transformers/all-MiniLM-L6-v2
            - name: EMBEDDING_DIM
              value: "384"
          ports:
            - containerPort: 8081
