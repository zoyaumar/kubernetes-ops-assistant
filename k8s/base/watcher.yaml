# Watcher Deployment
#
# Runs as the k8s-ops-watcher ServiceAccount for RBAC-limited K8s API access.
# Single replica — the watcher does not need to scale (it's not a bottleneck).
#
# TODO(week-2): fill in image tag once CI/CD is set up
# TODO(week-2): add ConfigMap for non-secret config
# TODO(week-3): add liveness/readiness probes on :8080/health, :8080/ready
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher
  namespace: k8s-ops
  labels:
    app.kubernetes.io/name: watcher
    app.kubernetes.io/component: watcher
    app.kubernetes.io/part-of: k8s-ops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watcher
  template:
    metadata:
      labels:
        app: watcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: k8s-ops-watcher
      containers:
        - name: watcher
          image: ghcr.io/YOUR_GITHUB_USER/watcher:latest  # TODO: replace with git-sha tag
          env:
            - name: CLUSTER_ID
              value: local-kind
            - name: NATS_URL
              value: nats://nats.k8s-ops.svc.cluster.local:4222
            - name: LOG_LEVEL
              value: info
          ports:
            - containerPort: 8080  # health + metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
