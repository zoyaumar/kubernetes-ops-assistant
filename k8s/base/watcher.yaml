apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher
  namespace: k8s-ops
  labels:
    app.kubernetes.io/name: watcher
    app.kubernetes.io/component: watcher
    app.kubernetes.io/part-of: k8s-ops-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watcher
  template:
    metadata:
      labels:
        app: watcher
    spec:
      serviceAccountName: k8s-ops-watcher
      containers:
        - name: watcher
          image: watcher:dev
          env:
            - name: CLUSTER_ID
              value: local-kind
            - name: NATS_URL
              value: nats://nats.k8s-ops.svc.cluster.local:4222
          ports:
            - containerPort: 8080
