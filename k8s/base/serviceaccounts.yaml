# Service account for the watcher.
# The watcher needs read-only access to Kubernetes resources.
# Credentials are automatically mounted via the ServiceAccount token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ops-watcher
  namespace: k8s-ops
  labels:
    app.kubernetes.io/component: watcher
    app.kubernetes.io/part-of: k8s-ops-assistant
